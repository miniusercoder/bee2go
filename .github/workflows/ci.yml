name: CI

on:
  push:
    branches: [main]
    tags: ['v3.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }} and upstream C tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22.x', stable]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: sudo apt-get update && sudo apt-get install -y cmake make gcc patch
      - run: make setup
      - run: go vet ./...
      - run: make test-c
      - run: go test ./... -count=1
      - run: go run ./cmd/selftest
      - run: go run ./cmd/demo

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make setup
      - run: go test -race ./... -count=1

  cgocheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make setup
      - run: go test ./... -count=1
        env:
          GOEXPERIMENT: cgocheck2

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: bash scripts/test_sanitizers.sh

  release-checks:
    if: startsWith(github.ref, 'refs/tags/v3.') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make setup
      - run: go test -tags slow ./... -count=1 -timeout=20m
      - run: bash scripts/test_fuzz.sh
